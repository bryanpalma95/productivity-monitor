<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Productivity Monitor - Monitorea tu productividad con captura de pantalla, transcripción de audio y reportes detallados.">
  <meta name="theme-color" content="#1a73e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Productivity Monitor — Monitoreo de Productividad</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/standalone.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <!-- Loading indicator -->
  <div id="app-loading" class="app-loading">
    <div class="spinner"></div>
    <p>Cargando Productivity Monitor...</p>
  </div>

  <!-- App container (populated by JS) -->
  <div id="app-root"></div>

  <!-- Forzar desregistro del Service Worker viejo antes de cargar la app -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(regs => {
        regs.forEach(reg => {
          reg.unregister().then(() => {
            // Limpiar todos los caches del SW viejo
            caches.keys().then(keys => {
              keys.forEach(k => caches.delete(k));
            });
          });
        });
      });
    }
  </script>

  <!-- Firebase SDK (compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <!-- Módulos de la aplicación -->
  <script src="js/firebase-config.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/core.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/monitor.js"></script>
  <script src="js/sessions.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/init.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
